<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Daily Todo List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --text: #e8eaf6;
      --text-sub: #7b82a8;
      --accent: #6c7fe8;
      --accent-light: #1e2240;
      --todo: #7b82a8;
      --todo-bg: #1e2138;
      --prog: #6c7fe8;
      --prog-bg: #1a1f3a;
      --done: #4eca8b;
      --done-bg: #0f231a;
      --high-bg: #2a1a1a;
      --high: #f07070;
      --shadow: 0 2px 16px rgba(0,0,0,0.4);
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 { font-size: 1.7rem; font-weight: 700; color: var(--text); }
    header h1 span { color: var(--accent); }

    .date-badge {
      font-size: 0.85rem;
      color: var(--text-sub);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .stat-card .num { font-size: 1.8rem; font-weight: 700; line-height: 1; }
    .stat-card .label { font-size: 0.78rem; color: var(--text-sub); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

    .stat-total .num { color: var(--accent); }
    .stat-done .num  { color: var(--done); }
    .stat-tagged .num { color: #c47fe8; }
    .stat-prog .num  { color: var(--prog); }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      align-items: center;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      align-items: center;
    }

    .filter-row-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-sub);
      margin-right: 2px;
      white-space: nowrap;
    }

    .filter-btn {
      font-size: 0.82rem;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { background: var(--surface2); color: var(--text); }
    .filter-btn.active { color: #fff; border-color: transparent; }
    .filter-btn.active-status { background: var(--accent); }

    .spacer { flex: 1; min-width: 8px; }

    .search-box {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.85rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
      width: 200px;
      transition: border-color 0.15s;
    }
    .search-box:focus { border-color: var(--accent); }

    /* Add form */
    .add-form {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .add-form h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: var(--text); }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-grid .full { grid-column: 1 / -1; }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface2);
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 60px; }

    .field .hint {
      font-size: 0.74rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }

    .btn {
      padding: 8px 20px;
      border-radius: 7px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #5567d0; }
    .btn-ghost { background: transparent; color: var(--text-sub); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); }

    /* Todo list */
    .todo-list { display: flex; flex-direction: column; gap: 10px; }

    .todo-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
      transition: box-shadow 0.15s, opacity 0.15s;
    }

    .todo-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.35); }
    .todo-card.done-card { opacity: 0.55; }

    .check-col { padding-top: 2px; }

    .check-box {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .check-box:hover { border-color: var(--done); }
    .check-box.checked { background: var(--done); border-color: var(--done); }
    .check-box.checked::after { content: "✓"; color: #0f231a; font-size: 12px; font-weight: 800; }

    .todo-body { min-width: 0; }

    .todo-title {
      font-size: 0.97rem;
      font-weight: 600;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .done-card .todo-title { text-decoration: line-through; color: var(--text-sub); }

    .todo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 0.73rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Status badges */
    .badge-todo       { background: var(--todo-bg); color: var(--todo); }
    .badge-inprogress { background: var(--prog-bg); color: var(--prog); }
    .badge-done       { background: var(--done-bg); color: var(--done); }

    /* Tag badges — colors set inline via JS */
    .badge-tag {
      font-size: 0.73rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    .meta-item {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .meta-item svg { flex-shrink: 0; }

    .todo-url a {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }
    .todo-url a:hover { text-decoration: underline; }

    .todo-notes {
      font-size: 0.82rem;
      color: var(--text-sub);
      background: var(--surface2);
      border-radius: 6px;
      padding: 6px 10px;
      margin-top: 6px;
    }

    .actions-col { display: flex; gap: 6px; }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:hover { background: var(--surface2); color: var(--text); }
    .icon-btn.delete:hover { background: var(--high-bg); color: var(--high); border-color: var(--high); }

    /* Deadline states */
    .todo-card.overdue {
      border-color: #c0392b;
      box-shadow: 0 0 0 2px rgba(192,57,43,0.3), var(--shadow);
    }
    .todo-card.due-soon {
      border-color: #d68910;
      box-shadow: 0 0 0 2px rgba(214,137,16,0.25), var(--shadow);
    }
    .deadline-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.73rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .deadline-chip.overdue { background: rgba(192,57,43,0.18); color: #f07070; border: 1px solid rgba(192,57,43,0.4); animation: pulse-red 2s ease-in-out infinite; }
    .deadline-chip.soon    { background: rgba(214,137,16,0.15); color: #f5a623; border: 1px solid rgba(214,137,16,0.35); }
    .deadline-chip.ok      { background: var(--surface2); color: var(--text-sub); border: 1px solid var(--border); }
    @keyframes pulse-red { 0%,100%{opacity:1} 50%{opacity:0.55} }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-sub);
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }
    .empty-state p { margin-top: 8px; font-size: 0.9rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 48px rgba(0,0,0,0.5);
      padding: 28px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
      .todo-card { grid-template-columns: auto 1fr; }
      .actions-col { grid-column: 1 / -1; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>My <span>Todo List</span></h1>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="date-badge" id="dateBadge"></div>
      <a href="todo-board.html" style="font-size:0.82rem;font-weight:600;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);text-decoration:none;display:flex;align-items:center;gap:6px;transition:all 0.15s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-sub)'">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        The View
      </a>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card stat-total">
      <div class="num" id="statTotal">0</div>
      <div class="label">Total</div>
    </div>
    <div class="stat-card stat-prog">
      <div class="num" id="statProg">0</div>
      <div class="label">In Progress</div>
    </div>
    <div class="stat-card stat-tagged">
      <div class="num" id="statTagged">0</div>
      <div class="label">Tagged</div>
    </div>
    <div class="stat-card stat-done">
      <div class="num" id="statDone">0</div>
      <div class="label">Done</div>
    </div>
  </div>

  <!-- Add form -->
  <div class="add-form">
    <h2>+ Add New Todo</h2>
    <div class="form-grid">
      <div class="field full">
        <label>Task *</label>
        <input type="text" id="newTask" placeholder="What needs to be done?" />
      </div>
      <div class="field">
        <label>Status</label>
        <select id="newStatus">
          <option value="To Do" selected>To Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>
      <div class="field">
        <label>Tag</label>
        <input type="text" id="newTag" list="tagSuggestions" placeholder="e.g. Design, Backend…" autocomplete="off" />
        <datalist id="tagSuggestions"></datalist>
        <div class="hint">Optional — type any label</div>
      </div>
      <div class="field">
        <label>Stakeholder</label>
        <input type="text" id="newStakeholder" placeholder="e.g. John Smith" />
      </div>
      <div class="field">
        <label>Deadline</label>
        <input type="date" id="newDeadline" />
        <div class="hint">Optional</div>
      </div>
      <div class="field">
        <label>URL / Resource</label>
        <input type="url" id="newUrl" placeholder="https://..." />
      </div>
      <div class="field full">
        <label>Notes</label>
        <textarea id="newNotes" placeholder="Any extra context or details..."></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
      <button class="btn btn-primary" onclick="addTodo()">Add Todo</button>
    </div>
  </div>

  <!-- Status filter row -->
  <div class="toolbar">
    <div class="filter-row-label">Status</div>
    <div class="filter-row" id="statusFilters" style="margin-bottom:0;flex:1">
      <button class="filter-btn active active-status" data-filter="all" onclick="setFilter('status','all',this)">All</button>
      <button class="filter-btn" data-filter="To Do" onclick="setFilter('status','To Do',this)">To Do</button>
      <button class="filter-btn" data-filter="In Progress" onclick="setFilter('status','In Progress',this)">In Progress</button>
      <button class="filter-btn" data-filter="Done" onclick="setFilter('status','Done',this)">Done</button>
    </div>
    <div class="spacer"></div>
    <input class="search-box" type="text" id="searchBox" placeholder="Search todos…" oninput="render()" />
  </div>

  <!-- Tag filter row (dynamic) -->
  <div class="filter-row" id="tagFilters">
    <!-- rendered by JS -->
  </div>

  <!-- Todo list -->
  <div class="todo-list" id="todoList"></div>
</div>

<!-- Edit modal -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal">
    <h2>Edit Todo</h2>
    <div class="form-grid">
      <div class="field full">
        <label>Task *</label>
        <input type="text" id="editTask" />
      </div>
      <div class="field">
        <label>Status</label>
        <select id="editStatus">
          <option value="To Do">To Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>
      <div class="field">
        <label>Tag</label>
        <input type="text" id="editTag" list="editTagSuggestions" placeholder="e.g. Design, Backend…" autocomplete="off" />
        <datalist id="editTagSuggestions"></datalist>
        <div class="hint">Optional — type any label</div>
      </div>
      <div class="field">
        <label>Stakeholder</label>
        <input type="text" id="editStakeholder" />
      </div>
      <div class="field">
        <label>Deadline</label>
        <input type="date" id="editDeadline" />
        <div class="hint">Optional</div>
      </div>
      <div class="field">
        <label>URL / Resource</label>
        <input type="url" id="editUrl" />
      </div>
      <div class="field full">
        <label>Notes</label>
        <textarea id="editNotes"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script>
  // ---- State ----
  let todos = JSON.parse(localStorage.getItem('filip_todos') || '[]');
  let filters = { status: 'all', tag: 'all' };
  let editIndex = null;

  // ---- Persist ----
  function save() { localStorage.setItem('filip_todos', JSON.stringify(todos)); }

  // ---- Date ----
  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function updateDate() {
    const d = new Date();
    document.getElementById('dateBadge').textContent =
      `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()} ${d.getFullYear()}`;
  }
  updateDate();

  // ---- Tag color (deterministic hash → HSL, dark-theme friendly) ----
  function hashStr(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  // Returns { color, background, borderColor } for a tag string
  function tagColors(tag) {
    const hue = hashStr(tag.toLowerCase()) % 360;
    // Spread hues into visually distinct bands so nearby letters don't clash
    const spreadHue = (hue * 137.508) % 360;
    const color      = `hsl(${spreadHue}, 75%, 70%)`;
    const background = `hsl(${spreadHue}, 50%, 14%)`;
    const border     = `hsl(${spreadHue}, 45%, 28%)`;
    return { color, background, border };
  }

  function tagBadgeHtml(tag) {
    if (!tag) return '';
    const c = tagColors(tag);
    return `<span class="badge-tag" style="color:${c.color};background:${c.background};border:1px solid ${c.border}">${escHtml(tag)}</span>`;
  }

  // ---- Unique tags list ----
  function allTags() {
    const seen = new Set();
    todos.forEach(t => { if (t.tag) seen.add(t.tag); });
    return [...seen].sort((a, b) => a.localeCompare(b));
  }

  // ---- Datalist suggestions ----
  function refreshTagSuggestions() {
    const tags = allTags();
    ['tagSuggestions', 'editTagSuggestions'].forEach(id => {
      const dl = document.getElementById(id);
      if (dl) dl.innerHTML = tags.map(t => `<option value="${escHtml(t)}">`).join('');
    });
  }

  // ---- Deadline helpers ----
  function deadlineStatus(todo) {
    if (!todo.deadline || todo.status === 'Done') return '';
    const today    = new Date(); today.setHours(0,0,0,0);
    const due      = new Date(todo.deadline + 'T00:00:00');
    const diffDays = Math.round((due - today) / 86400000);
    if (diffDays < 0)  return 'overdue';
    if (diffDays <= 1) return 'soon';
    return 'ok';
  }
  function fmtDeadline(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ---- Add ----
  function addTodo() {
    const task = document.getElementById('newTask').value.trim();
    if (!task) { document.getElementById('newTask').focus(); return; }
    todos.unshift({
      id: Date.now(),
      task,
      status:      document.getElementById('newStatus').value,
      tag:         document.getElementById('newTag').value.trim(),
      stakeholder: document.getElementById('newStakeholder').value.trim(),
      deadline:    document.getElementById('newDeadline').value || '',
      url:         document.getElementById('newUrl').value.trim(),
      notes:       document.getElementById('newNotes').value.trim(),
      createdAt:   new Date().toLocaleDateString()
    });
    save(); clearForm(); render();
  }

  function clearForm() {
    ['newTask','newTag','newStakeholder','newDeadline','newUrl','newNotes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('newStatus').value = 'To Do';
  }

  // ---- Delete ----
  function deleteTodo(idx) {
    if (!confirm('Delete this todo?')) return;
    todos.splice(idx, 1); save(); render();
  }

  // ---- Toggle done ----
  function toggleDone(idx) {
    todos[idx].status = todos[idx].status === 'Done' ? 'To Do' : 'Done';
    save(); render();
  }

  // ---- Edit ----
  function openEdit(idx) {
    editIndex = idx;
    const t = todos[idx];
    document.getElementById('editTask').value        = t.task;
    document.getElementById('editStatus').value      = t.status;
    document.getElementById('editTag').value         = t.tag || '';
    document.getElementById('editStakeholder').value = t.stakeholder || '';
    document.getElementById('editDeadline').value    = t.deadline || '';
    document.getElementById('editUrl').value         = t.url || '';
    document.getElementById('editNotes').value       = t.notes || '';
    refreshTagSuggestions();
    document.getElementById('editModal').classList.remove('hidden');
  }

  function closeEdit() {
    editIndex = null;
    document.getElementById('editModal').classList.add('hidden');
  }

  function saveEdit() {
    if (editIndex === null) return;
    const task = document.getElementById('editTask').value.trim();
    if (!task) return;
    todos[editIndex] = {
      ...todos[editIndex],
      task,
      status:      document.getElementById('editStatus').value,
      tag:         document.getElementById('editTag').value.trim(),
      stakeholder: document.getElementById('editStakeholder').value.trim(),
      deadline:    document.getElementById('editDeadline').value || '',
      url:         document.getElementById('editUrl').value.trim(),
      notes:       document.getElementById('editNotes').value.trim(),
    };
    save(); closeEdit(); render();
  }

  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEdit();
  });

  // ---- Filters ----
  function setFilter(type, val, btn) {
    filters[type] = val;
    const groupId = type === 'status' ? 'statusFilters' : 'tagFilters';
    document.querySelectorAll(`#${groupId} .filter-btn`).forEach(b => {
      b.classList.remove('active');
      if (type === 'status') b.classList.remove('active-status');
      // restore default style for tag buttons
      if (type === 'tag') { b.style.background = ''; b.style.color = ''; b.style.borderColor = ''; }
    });
    btn.classList.add('active');
    if (type === 'status') {
      btn.classList.add('active-status');
    } else {
      // color tag filter button with its own tag color when active
      if (val !== 'all') {
        const c = tagColors(val);
        btn.style.background   = c.background;
        btn.style.color        = c.color;
        btn.style.borderColor  = c.border;
      }
    }
    render();
  }

  // ---- Render tag filter row ----
  function renderTagFilters() {
    const tags = allTags();
    const row  = document.getElementById('tagFilters');
    const currentTag = filters.tag;

    let html = `<span class="filter-row-label">Tags</span>`;
    html += `<button class="filter-btn${currentTag === 'all' ? ' active' : ''}" onclick="setFilter('tag','all',this)">All Tags</button>`;

    tags.forEach(tag => {
      const c       = tagColors(tag);
      const isActive = currentTag === tag;
      const style   = isActive
        ? `background:${c.background};color:${c.color};border-color:${c.border}`
        : ``;
      html += `<button class="filter-btn${isActive ? ' active' : ''}" style="${style}" onclick="setFilter('tag',${JSON.stringify(tag)},this)">${escHtml(tag)}</button>`;
    });

    row.innerHTML = html;
  }

  // ---- Render ----
  function render() {
    refreshTagSuggestions();
    renderTagFilters();

    const search = document.getElementById('searchBox').value.toLowerCase();

    const filtered = todos.map((t, i) => ({...t, _idx: i})).filter(t => {
      if (filters.status !== 'all' && t.status !== filters.status) return false;
      if (filters.tag    !== 'all' && t.tag    !== filters.tag)    return false;
      if (search && !t.task.toLowerCase().includes(search) &&
          !(t.tag||'').toLowerCase().includes(search) &&
          !(t.stakeholder||'').toLowerCase().includes(search) &&
          !(t.notes||'').toLowerCase().includes(search)) return false;
      return true;
    });

    // Stats
    document.getElementById('statTotal').textContent  = todos.length;
    document.getElementById('statDone').textContent   = todos.filter(t => t.status === 'Done').length;
    document.getElementById('statTagged').textContent = todos.filter(t => t.tag).length;
    document.getElementById('statProg').textContent   = todos.filter(t => t.status === 'In Progress').length;

    const list = document.getElementById('todoList');
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state">
        <div style="font-size:2rem">📋</div>
        <p>${todos.length === 0 ? 'No todos yet — add one above!' : 'No todos match your filters.'}</p>
      </div>`;
      return;
    }

    list.innerHTML = filtered.map(t => {
      const sClass = `badge-${t.status.replace(/ /g,'').toLowerCase()}`;
      const isDone = t.status === 'Done';
      const ds     = deadlineStatus(t);
      const deadlineClass = ds === 'overdue' ? ' overdue' : ds === 'soon' ? ' due-soon' : '';

      return `
      <div class="todo-card ${isDone ? 'done-card' : ''}${deadlineClass}">
        <div class="check-col">
          <div class="check-box ${isDone ? 'checked' : ''}" onclick="toggleDone(${t._idx})" title="${isDone ? 'Mark incomplete' : 'Mark done'}"></div>
        </div>
        <div class="todo-body">
          <div class="todo-title">${escHtml(t.task)}</div>
          <div class="todo-meta">
            <span class="badge ${sClass}">${t.status}</span>
            ${t.tag ? tagBadgeHtml(t.tag) : ''}
            ${t.deadline ? `<span class="deadline-chip ${ds}">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${ds === 'overdue' ? '⚠ Overdue · ' : ds === 'soon' ? 'Due soon · ' : ''}${fmtDeadline(t.deadline)}
            </span>` : ''}
            ${t.stakeholder ? `<span class="meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              ${escHtml(t.stakeholder)}
            </span>` : ''}
            ${t.createdAt ? `<span class="meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${t.createdAt}
            </span>` : ''}
          </div>
          ${t.url ? `<div class="todo-url">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:3px"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <a href="${escHtml(t.url)}" target="_blank" rel="noopener">${escHtml(t.url)}</a>
          </div>` : ''}
          ${t.notes ? `<div class="todo-notes">${escHtml(t.notes)}</div>` : ''}
        </div>
        <div class="actions-col">
          <button class="icon-btn" onclick="openEdit(${t._idx})" title="Edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn delete" onclick="deleteTodo(${t._idx})" title="Delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>`;
    }).join('');
  }

  function escHtml(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('newTask').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  render();
</script>
</body>
</html>
